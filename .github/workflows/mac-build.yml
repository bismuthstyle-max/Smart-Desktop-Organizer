name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter watchdog pypdf pyinstaller

    - name: Build macOS App with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "Smart Desktop Organizer Pro" Clean.py

    - name: Zip the .app file
      run: |
        cd dist
        zip -r "../SmartDesktopOrganizer_macOS.zip" "Smart Desktop Organizer Pro.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartDesktopOrganizer_macOS
        path: SmartDesktopOrganizer_macOS.zip

    - name: Upload macOS Zip to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: SmartDesktopOrganizer_macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
